name: Debug Issue 134 (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/issue-134-release-exit-128

permissions:
  contents: read

jobs:
  trace:
    name: Trace release.sh under bash -x
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build archives (traced)
        run: bash -x ./scripts/release.sh "nightly-20260709-debug134-${GITHUB_RUN_ID}"
